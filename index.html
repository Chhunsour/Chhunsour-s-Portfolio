<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Chhunsour Seng's portfolio is being updated. Please check back soon." />
    <meta property="og:title" content="Chhunsour Seng — Portfolio in Progress" />
    <meta property="og:description" content="A new version of this portfolio is on its way." />
    <meta property="og:type" content="website" />
    <title>Chhunsour Seng — Portfolio in Progress</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding: clamp(24px, 4vw, 56px);
        background: #080808;
        color: #f5f3ef;
        font-family: Arial, Helvetica, sans-serif;
      }
      header, footer { display: flex; align-items: center; justify-content: space-between; }
      header { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .mark { width: 7px; height: 7px; border-radius: 50%; background: #f5f3ef; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 720px; }
      .eyebrow, footer { color: #8f8f8f; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
      .eyebrow { margin: 0 0 28px; }
      h1 { max-width: 700px; margin: 0; font-size: clamp(48px, 9vw, 112px); font-weight: 500; letter-spacing: -.075em; line-height: .96; }
      .detail { max-width: 390px; margin: 30px 0 0; color: #aaa; font-size: clamp(14px, 1.5vw, 16px); line-height: 1.6; }
      footer { border-top: 1px solid #282828; padding-top: 20px; }
    </style>
  </head>
  <body>
    <header><span>Chhunsour Seng</span><span class="mark" aria-hidden="true"></span></header>
    <main>
      <p class="eyebrow">Portfolio update in progress</p>
      <h1>In the works.</h1>
      <p class="detail">I'm making a few changes to this space. Please check back soon.</p>
    </main>
    <footer><span>Designer &amp; Developer</span><span>Coming soon</span></footer>
  </body>
</html>
